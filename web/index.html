 <!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InterpelliScuola Nazionale</title>
<style>
:root{ --bg:#F4F6FB; --card:#FFFFFF; --border:#DDE3EF; --text:#1B2437; --dim:#6B7690; --field:#EEF1F8; --accent:#2358D0; }
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:960px;margin:0 auto;padding:16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:16px;}
h1{margin:0;font-size:24px;}
.sub{color:var(--dim);font-size:14px;margin-top:6px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
label{display:block;font-size:15px;color:var(--dim);margin-bottom:6px;}
select,input{width:100%;background:var(--field);border:1px solid var(--border);border-radius:12px;padding:14px 12px;font-size:16px;color:var(--text);}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;}
button{font-size:17px;font-weight:600;border-radius:12px;padding:14px 20px;border:1px solid var(--border);background:var(--field);color:var(--text);}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
#fonti{margin-top:16px;font-size:14px;}
#fonti h3{margin:14px 0 6px;font-size:15px;}
#fonti a{display:inline-block;margin:0 10px 6px 0;color:var(--accent);font-weight:600;text-decoration:none;}
#status{color:var(--dim);font-size:14px;margin:0 4px 12px;line-height:1.5;}
#status.error{color:#C0392B;font-weight:600;}
.tablewrap{overflow-x:auto;padding:0;}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:880px;}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top;}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;}
.dim{color:var(--dim);font-size:12px;margin-top:2px;}
a.btn{color:var(--accent);text-decoration:none;font-weight:700;}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
.b-open{background:#E3F6EA;color:#17803D;}
.b-today{background:#FFF1DA;color:#B45309;}
.b-closed{background:#FBE4E4;color:#B42318;}
.b-nd{background:#ECEFF5;color:#5B6680;}
.b-new{background:#E4ECFF;color:#2358D0;margin-left:6px;}
#more{text-align:center;padding-bottom:30px;}
</style>
</head>

<div class="sub" id="freshness">Caricamento in corso...</div>
</div>

<option value="nuovo">Nuovo oggi</option>
<option value="attivo">In corso / attivo</option>
<option value="scade">In scadenza oggi</option>
<option value="scaduto">Archiviato / scaduto</option>
</select></div>
<div><label for="fSearch">Cerca</label><input type="text" id="fSearch" placeholder="Scuola, comune, classe (es. A047)"></div>
</div>
<div class="btns">
<button class="primary" id="btnCerca">🔍 Cerca</button>
<button id="btnReset">Reset filtri</button>
<button id="btnFonti">Fonti ufficiali</button>

<div id="fonti" hidden></div>
</div>

<div id="status"></div>

function fmtDate(s){
  if(!s) return "—";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  return m ? m[3] + "/" + m[2] + "/" + m[1] : s;
}

function safeUrl(u){
  try{
    const x = new URL(u);
    return (x.protocol === "http:" || x.protocol === "https:") ? x.href : null;
  }catch(e){
    return null;
  }
}

function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function classLabel(k){

}

function statoOf(r, today){
  const sca = (r.data_scadenza || "").slice(0, 10);
  if(!sca) return { key: "nd", label: "Scadenza non indicata", cls: "b-nd" };
  if(sca < today) return { key: "chiuso", label: "Chiuso", cls: "b-closed" };
  if(sca === today) return { key: "oggi", label: "Scade oggi", cls: "b-today" };
  return { key: "aperto", label: "Aperto", cls: "b-open" };
}

function isNuovo(r, today){
  return (r.data_pubblicazione || "").slice(0, 10) === today;

async function fetchAll(){
  const out = [];
  let offset = 0;
  for(let i = 0; i < 50; i++){
    const url = SUPABASE_URL + "/rest/v1/interpelli?select=*&order=data_pubblicazione.desc.nullslast,record_key.asc&limit=" + PAGE_SIZE + "&offset=" + offset;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
    });
    if(!res.ok){
      const t = await res.text();
      throw new Error("Il database ha risposto " + res.status + ": " + t.slice(0, 200));
    }
    const batch = await res.json();
    if(!Array.isArray(batch) || batch.length === 0) break;
    out.push(...batch);
    $("freshness").textContent = "Caricamento in corso... " + out.length + " interpelli";
    offset += batch.length;
  }
  return out;
}

function prepare(r){
  r._c = (r.classe_concorso || "").toUpperCase().trim();
  r._canon = canon(r._c);
  const k = CLASS_BY_CODE[r._c] || CLASS_BY_CODE[r._canon];
  let gradi = k && k.g ? k.g.split(",") : [];
  if(gradi.length === 0 && ATA_RE.test(r.scuola || "")) gradi = ["ATA"];
  r._gradi = gradi;
  r._hay = [r.scuola, r.comune, r.classe_concorso, k ? k.d : "", r.provincia, r.regione, r.codice_meccanografico, r.tipologia_posto]
    .filter(Boolean).join(" ").toLowerCase();
}

function addOption(sel, value, label){
  const o = document.createElement("option");
  o.value = value;
  o.textContent = label;
  sel.appendChild(o);
}

function fillRegioni(){
  const regs = [...new Set(allRecords.map(r => r.regione).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "it"));
  regs.forEach(r => addOption($("fRegione"), r, r));
}

function fillProvince(){
  const reg = $("fRegione").value;
  const sel = $("fProvincia");
  const prev = sel.value;
  sel.innerHTML = '<option value="">Tutte</option>';
  const provs = [...new Set(
    allRecords.filter(r => !reg || r.regione === reg).map(r => r.provincia).filter(Boolean)
  )].sort();
  provs.forEach(p => addOption(sel, p, p));
  if(provs.includes(prev)) sel.value = prev;
}

  const sel = $("fClasse");
  const prev = sel.value;
  sel.innerHTML = '<option value="">Tutte</option>';
  CLASSI.forEach(k => {
    if(grado && !k.g.split(",").includes(grado)) return;
    addOption(sel, k.c, classLabel(k));
  });
  if(prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function hasSearch(){
  return !!($("fRegione").value || $("fProvincia").value || $("fGrado").value ||
            $("fClasse").value || $("fStato").value || $("fSearch").value.trim());
}

function statoOk(r, stato, today){
  const sca = (r.data_scadenza || "").slice(0, 10);
  if(stato === "nuovo") return isNuovo(r, today);
  if(stato === "attivo") return !sca || sca >= today;
  if(stato === "scade") return sca === today;
  if(stato === "scaduto") return !!sca && sca < today;
  return true;
}

function applyFilters(){
  shown = SHOW_STEP;
  if(!hasSearch()){
    filtered = [];
    render();
    return;
  }
  const reg = $("fRegione").value;
  const prov = $("fProvincia").value;
  const grado = $("fGrado").value;
  const cls = $("fClasse").value;
  const stato = $("fStato").value;
  const q = $("fSearch").value.trim().toLowerCase();
  const today = todayISO();
  const clsCanon = cls ? canon(cls) : "";
  const qUp = q.toUpperCase();
  const qClass = CLASS_BY_CODE[qUp] ? canon(qUp) : "";
  filtered = allRecords.filter(r => {
    if(reg && r.regione !== reg) return false;
    if(prov && r.provincia !== prov) return false;
    if(grado && !r._gradi.includes(grado)) return false;
    if(clsCanon && r._canon !== clsCanon) return false;
    if(!statoOk(r, stato, today)) return false;
    if(qClass){
      if(r._canon !== qClass) return false;
    }else if(q && !r._hay.includes(q)){
      return false;
    }
    return true;
  });
  render();
}

function cell(text){
  const td = document.createElement("td");
  td.textContent = text;
  return td;
}

function classCell(r){
  const td = document.createElement("td");
  if(!r._c){
    td.textContent = "—";
    return td;
  }
  const b = document.createElement("strong");
  b.textContent = r._c;
  td.appendChild(b);
  const k = CLASS_BY_CODE[r._c];
  if(k){
    const s = document.createElement("div");
    s.className = "dim";
    s.textContent = k.d;
    td.appendChild(s);
  }
  return td;
}

function statoCell(r, today){
  const td = document.createElement("td");
  const s = statoOf(r, today);
  const b = document.createElement("span");
  b.className = "badge " + s.cls;
  b.textContent = s.label;
  td.appendChild(b);
  if(isNuovo(r, today)){
    const n = document.createElement("span");
    n.className = "badge b-new";
    n.textContent = "Nuovo";
    td.appendChild(n);
  }
  return td;
}

function render(){
  const tb = $("tbody");
  tb.innerHTML = "";
  $("more").innerHTML = "";
  const st = $("status");
  st.className = "";

  if(!hasSearch()){
    $("tablecard").hidden = true;
    st.textContent = "Scegli una regione, un grado, una classe di concorso oppure scrivi nella ricerca (es. A047), poi tocca Cerca. Senza una ricerca non viene mostrato nulla.";
    return;
  }
  if(filtered.length === 0){
    $("tablecard").hidden = true;
    st.textContent = "Nessun interpello trovato per questa ricerca.";
    return;
  }

  const today = todayISO();
  $("tablecard").hidden = false;

  const c = { aperto: 0, oggi: 0, chiuso: 0, nd: 0 };
  filtered.forEach(r => { c[statoOf(r, today).key]++; });
  st.textContent = "Trovati " + filtered.length + " interpelli: " + (c.aperto + c.oggi) + " aperti, " +
    c.chiuso + " chiusi, " + c.nd + " senza scadenza indicata. Mostrati " + Math.min(shown, filtered.length) + ".";

  const frag = document.createDocumentFragment();
  filtered.slice(0, shown).forEach(r => {
    const tr = document.createElement("tr");
    tr.appendChild(cell(r.scuola || "—"));
    const loc = r.comune || [r.provincia, r.regione].filter(Boolean).join(" · ") || "—";
    tr.appendChild(cell(loc));
    tr.appendChild(cell(r._gradi.map(g => GRADO_LABEL[g]).join(" / ") || "—"));
    tr.appendChild(classCell(r));
    tr.appendChild(cell(fmtDate(r.data_pubblicazione)));
    tr.appendChild(cell(fmtDate(r.data_scadenza)));
    tr.appendChild(statoCell(r, today));
    const td = document.createElement("td");
    const u = safeUrl(r.url_diretto);
    if(u){
      const a = document.createElement("a");
      a.className = "btn";
      a.href = u;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Apri";
      td.appendChild(a);
    }else{
      td.textContent = "—";
    }
    tr.appendChild(td);
    frag.appendChild(tr);
  });
  tb.appendChild(frag);

  if(shown < filtered.length){
    const b = document.createElement("button");
    b.className = "primary";
    b.textContent = "Mostra altri";
    b.onclick = () => { shown += SHOW_STEP; render(); };
    $("more").appendChild(b);
  }
}

function resetFilters(){
  $("fRegione").value = "";
  $("fGrado").value = "";
  $("fStato").value = "";
  $("fSearch").value = "";
  fillProvince();
  $("fProvincia").value = "";
  fillClassi();
  $("fClasse").value = "";
  applyFilters();
}

async function toggleFonti(){
  const box = $("fonti");
  if(!box.hidden){
    box.hidden = true;
    return;
  }
  box.hidden = false;
  if(box.dataset.loaded) return;
  box.textContent = "Caricamento fonti...";
  try{
    const res = await fetch("../sources_config.json", { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const cfg = await res.json();
    box.textContent = "";
    const byReg = {};
    cfg.sources.forEach(s => { (byReg[s.regione] = byReg[s.regione] || []).push(s); });
    Object.keys(byReg).sort((a, b) => a.localeCompare(b, "it")).forEach(reg => {
      const h = document.createElement("h3");
      h.textContent = reg;
      box.appendChild(h);
      byReg[reg].forEach(s => {
        const u = safeUrl(s.url);
        if(!u) return;
        const a = document.createElement("a");
        a.href = u;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = s.sigla;
        box.appendChild(a);
      });
    });
    box.dataset.loaded = "1";
  }catch(e){
    box.textContent = "Impossibile caricare l'elenco delle fonti (" + (e && e.message ? e.message : e) + ").";
  }
}

async function init(){
  fillClassi();
  render();
  try{
    allRecords = await fetchAll();
    allRecords.forEach(prepare);
    const last = allRecords.map(r => r.last_seen_at).filter(Boolean).sort().pop();
    const when = last ? new Date(last).toLocaleString("it-IT") : "n.d.";
    $("freshness").textContent = allRecords.length + " interpelli in archivio · ultimo aggiornamento: " + when;
    fillRegioni();
    fillProvince();
    applyFilters();
  }catch(e){
    $("freshness").textContent = "Errore nel caricamento dei dati";
    const st = $("status");
    st.className = "error";
    st.textContent = e && e.message ? e.message : String(e);
  }$("fRegione").addEventListener("change", fillProvince);
$("fGrado").addEventListener("change", fillClassi);
$("fSearch").addEventListener("keydown", (e) => { if(e.key === "Enter") applyFilters(); });
$("btnCerca").addEventListener("click", () => { applyFilters(); $("status").scrollIntoView({ behavior: "smooth" }); });
$("btnReset").addEventListener("click", resetFilters);
$("btnFonti").addEventListener("click", toggleFonti);
}

 
init();
</script>
